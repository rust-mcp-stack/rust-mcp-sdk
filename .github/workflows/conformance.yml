name: 🧪 MCP Conformance (2026-07-28)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  server-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MCP_CONFORMANCE_PORT: "3101"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance-server

      - name: Build conformance server
        run: cargo build -p conformance-server --release

      - name: Start server
        run: |
          cargo run -p conformance-server --release &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:3101/health; do sleep 0.5; done'

      - name: Run conformance (2026-07-28)
        run: |
          npx @modelcontextprotocol/conformance@0.2.0-alpha.10 server \
            --url http://127.0.0.1:3101/mcp \
            --spec-version 2026-07-28 \
            --suite all

  client-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance-client

      - name: Build conformance client
        run: cargo build -p conformance-client --release

      - name: Run conformance (2026-07-28)
        run: |
          npx @modelcontextprotocol/conformance@0.2.0-alpha.10 client \
            --command ./target/release/conformance-client \
            --spec-version 2026-07-28 \
            --suite all
