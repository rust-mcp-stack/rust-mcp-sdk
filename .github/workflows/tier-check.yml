name: 🏅 MCP Tier Check

on:
  workflow_dispatch:
    inputs:
      spec_version:
        description: "Spec version to check"
        required: true
        default: "2026-07-28"
  release:
    types: [published]

concurrency:
  group: tier-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach the report to a release
  issues: read
  pull-requests: read

jobs:
  tier-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MCP_CONFORMANCE_PORT: "3101"
      # Stable 0.1.16 predates MCP 2026-07-28. Keep this aligned with conformance.yml.
      CONFORMANCE_VERSION: "0.2.0-alpha.10"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tier-check

      - name: Build conformance server and client
        run: cargo build -p conformance-server -p conformance-client --release

      - name: Start conformance server
        run: |
          ./target/release/conformance-server &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:3101/health; do sleep 0.5; done'

      - name: Run tier check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          npx --yes @modelcontextprotocol/conformance@${CONFORMANCE_VERSION} tier-check \
            --repo "${{ github.repository }}" \
            --branch main \
            --conformance-server-url "http://127.0.0.1:3101/mcp" \
            --client-cmd "$GITHUB_WORKSPACE/target/release/conformance-client" \
            --spec-version "${{ inputs.spec_version || '2026-07-28' }}" \
            --output markdown > tier-report.md || status=$?

          if [ -f tier-report.md ]; then
            cat tier-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          if ! grep -qE 'Tier Assessment: Tier 1\b' tier-report.md; then
            echo "::error::Tier check did not reach Tier 1; see the report above."
            exit 1
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "Generated by [workflow run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          } >> tier-report.md

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-report
          path: tier-report.md
          if-no-files-found: warn

      - name: Attach report to release
        if: github.event_name == 'release' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" tier-report.md --clobber
